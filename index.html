<html lang="en">

<title>Felix's Notes Archive</title>
<style>
/* ── tokens ─────────────────────────────────────────────────────────────── */
/* Light theme is tinted toward the brand teal rather than plain white, so
   borders and panels actually read as structure. */
:root {
  --bg: #f0f5f8;
  --panel: #ffffff;
  --panel-2: #e8f0f5;
  --line: #d3e2ea;
  --line-strong: #b2cddb;
  --ink: #08181f;
  --ink-2: #3d5b67;
  --ink-3: #6a8794;

  --brand: #0d6a9e;
  --brand-2: #0f7f9b;
  --new: #0f7f9b;
  --green: #17914c;
  --gold: #9a6a0b;
  --mark: #a8e3f4;
  --shadow: 0 1px 2px rgba(8, 24, 31, .05);
  --shadow-lift: 0 10px 28px -12px rgba(8, 24, 31, .28);
  --lead-tint: linear-gradient(140deg, #f4fafc 0%, #e7f2f7 100%);

  /* One clean sans throughout — the serif was harder on the eye at length. */
  --ui: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #07090a;
    --panel: #101416;
    --panel-2: #171d21;
    --line: #242e33;
    --line-strong: #33424a;
    --ink: #f1f6f8;
    --ink-2: #a4b2b9;
    --ink-3: #75858d;

    --brand: #2fa8e0;
    --brand-2: #38b8dd;
    --new: #38b8dd;
    --green: #3ddc84;
    --gold: #d8a949;
    --mark: #0f4257;
    --shadow: 0 1px 2px rgba(0, 0, 0, .5);
    --shadow-lift: 0 12px 30px -14px rgba(0, 0, 0, .85);
    --lead-tint: linear-gradient(140deg, #141b1f 0%, #0e1416 100%);
  }
}
:root[data-theme="dark"] {
  --bg: #07090a;
  --panel: #101416;
  --panel-2: #171d21;
  --line: #242e33;
  --line-strong: #33424a;
  --ink: #f1f6f8;
  --ink-2: #a4b2b9;
  --ink-3: #75858d;

  --brand: #2fa8e0;
  --brand-2: #38b8dd;
  --new: #38b8dd;
  --green: #3ddc84;
  --gold: #d8a949;
  --mark: #0f4257;
  --shadow: 0 1px 2px rgba(0, 0, 0, .5);
  --shadow-lift: 0 12px 30px -14px rgba(0, 0, 0, .85);
  --lead-tint: linear-gradient(140deg, #141b1f 0%, #0e1416 100%);
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--ui); font-size: 16px; line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 62rem; margin: 0 auto; padding: 0 1.5rem; }
button { font: inherit; cursor: pointer; }

/* ── banner ─────────────────────────────────────────────────────────────── */
.banner {
  background: linear-gradient(115deg,#0b5f5c 0%,#0f6f92 48%,#1b93cf 100%);
  color: #fff;
}
.banner-in { display: flex; align-items: center; gap: 1.35rem; padding: 2.9rem 0 3rem; }
.mark {
  flex: none; width: 74px; height: 74px; border-radius: 19px; display: grid;
  place-items: center; background: rgba(255,255,255,.15);
  border: 1px solid rgba(255,255,255,.3);
}
.mark svg { width: 38px; height: 38px; }
.banner h1 {
  margin: 0; font-size: clamp(1.9rem, 4.6vw, 3.05rem); font-weight: 800;
  line-height: 1.02; letter-spacing: -.02em; text-transform: uppercase;
  text-wrap: balance;
}
.banner .sub { margin: .5rem 0 0; font-size: 1.02rem; color: rgba(255,255,255,.85); }
.banner-acts { margin-left: auto; display: flex; align-items: center; gap: .6rem; }
.gbtn {
  display: inline-flex; align-items: center; gap: .45rem; padding: .55rem 1rem;
  border-radius: 999px; background: rgba(255,255,255,.14); color: #fff;
  border: 1px solid rgba(255,255,255,.32); font-size: .84rem; font-weight: 700;
}
.gbtn:hover { background: rgba(255,255,255,.26); }
.gbtn[aria-pressed="true"] { background: #fff; color: #0f6f92; border-color: #fff; }
.gbtn svg { width: 17px; height: 17px; }
.gicon { padding: .55rem; width: 42px; height: 42px; justify-content: center; }

/* ── sections ───────────────────────────────────────────────────────────── */
.sec { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; margin: 2rem 0 .9rem; }
.sec h2 { margin: 0; font-size: 1.15rem; font-weight: 800; letter-spacing: -.01em; }
.sec p { margin: 0; font-size: .86rem; color: var(--ink-3); }

/* ── latest: one lead note, four stacked beside it ─────────────────────── */
/* Equal-weight cards gave the eye nothing to land on. A dominant lead with a
   secondary column is how a front page carries hierarchy. */
.latest { display: grid; grid-template-columns: 1.55fr 1fr; gap: 1.1rem; align-items: stretch; }
@media (max-width: 52rem) { .latest { grid-template-columns: 1fr; } }

.lead {
  display: flex; flex-direction: column; text-align: left; color: inherit;
  padding: 1.7rem 1.8rem; border-radius: 18px; background: var(--lead-tint);
  border: 1px solid var(--line); box-shadow: var(--shadow);
  transition: box-shadow .18s ease, border-color .18s ease, transform .18s ease;
}
.lead:hover { border-color: var(--line-strong); box-shadow: var(--shadow-lift); transform: translateY(-2px); }
.kicker {
  display: inline-flex; align-items: center; gap: .5rem; font-size: .69rem;
  font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--brand-2);
}
.kicker::before { content: ""; width: 1.6rem; height: 2px; background: currentColor; border-radius: 2px; }
.lead h3 {
  margin: .85rem 0 .6rem; font-size: clamp(1.35rem, 2.5vw, 1.72rem); font-weight: 800;
  line-height: 1.18; letter-spacing: -.024em; text-wrap: balance;
}
.lead p { margin: 0; font-size: .96rem; line-height: 1.62; color: var(--ink-2);
  display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.lead .go {
  margin-top: auto; padding-top: 1.1rem; font-size: .8rem; font-weight: 750;
  letter-spacing: .04em; color: var(--brand); display: inline-flex; align-items: center; gap: .4rem;
}
.lead:hover .go { gap: .6rem; }

.stack { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 18px; background: var(--panel); overflow: hidden; }
.stack-h {
  padding: .8rem 1.15rem; border-bottom: 1px solid var(--line); background: var(--panel-2);
  font-size: .67rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3);
}
.mini {
  flex: 1; display: flex; flex-direction: column; justify-content: center; gap: .22rem;
  padding: .8rem 1.15rem; text-align: left; background: none; border: 0;
  border-bottom: 1px solid var(--line); color: inherit;
}
.mini:last-child { border-bottom: 0; }
.mini:hover { background: var(--panel-2); }
.mini .when { font-size: .69rem; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.mini h4 { margin: 0; font-size: .92rem; font-weight: 700; line-height: 1.32; letter-spacing: -.01em;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* ── filters ────────────────────────────────────────────────────────────── */
.filters { display: flex; flex-wrap: wrap; gap: .6rem; margin-bottom: 1rem; }
.searchbox { position: relative; flex: 1 1 18rem; }
.searchbox svg { position: absolute; left: .85rem; top: 50%; transform: translateY(-50%); width: 17px; height: 17px; color: var(--ink-3); }
#q, #year {
  padding: .68rem .9rem; border-radius: 10px; background: var(--panel);
  border: 1px solid var(--line); color: var(--ink); font-size: .93rem;
}
#q { width: 100%; padding-left: 2.4rem; }
#q:focus, #year:focus { outline: 2px solid var(--brand-2); outline-offset: -1px; }
.selwrap { position: relative; }
#year { appearance: none; padding-right: 2.4rem; font-weight: 650; cursor: pointer; }
.selwrap::after {
  content: ""; position: absolute; right: 1rem; top: 50%; width: 8px; height: 8px;
  margin-top: -6px; border-right: 2px solid var(--ink-3); border-bottom: 2px solid var(--ink-3);
  transform: rotate(45deg); pointer-events: none;
}

/* ── list ───────────────────────────────────────────────────────────────── */
.list { border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: var(--panel); }
.ygroup {
  display: flex; align-items: baseline; gap: .75rem; padding: .85rem 1.3rem;
  background: var(--panel-2); border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 2;
}
.ygroup b { font-size: 1.05rem; font-weight: 800; letter-spacing: -.01em; }
.ygroup span { font-size: .7rem; font-weight: 750; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }

.row { display: flex; align-items: flex-start; gap: .3rem; padding-left: .55rem; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row:hover { background: var(--panel-2); }

/* A checkbox, because it is the control that marks a note read — a bare icon
   here gave no clue what it did. */
.readbox { flex: none; width: 44px; height: 44px; margin-top: .55rem; display: grid; place-items: center; background: none; border: 0; padding: 0; }
.box { width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--line-strong); display: grid; place-items: center; background: var(--panel); transition: border-color .15s, background .15s; }
.box svg { width: 12px; height: 12px; color: #fff; opacity: 0; }
.readbox:hover .box { border-color: var(--green); }
.is-read .box { background: var(--green); border-color: var(--green); }
.is-read .box svg { opacity: 1; }

.open { flex: 1; min-width: 0; display: flex; gap: 1rem; padding: .95rem .3rem; background: none; border: 0; color: inherit; text-align: left; }
.d {
  flex: none; width: 5.6rem; padding-top: .12rem; font-size: .78rem; font-weight: 750;
  color: var(--ink-3); font-variant-numeric: tabular-nums; letter-spacing: .01em;
}
.body { flex: 1; min-width: 0; }
.t { display: block; font-size: 1rem; font-weight: 700; line-height: 1.35; letter-spacing: -.012em; }
.is-read .t { font-weight: 550; color: var(--ink-2); }
.line {
  display: block; margin-top: .22rem; font-size: .875rem; line-height: 1.5; color: var(--ink-3);
  display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden;
}
.ctx { display: block; margin-top: .3rem; font-size: .855rem; font-weight: 400; line-height: 1.5; color: var(--ink-2); }

/* Unread marker, the way a reader app signals what is new. */
.newdot { flex: none; width: 7px; height: 7px; margin: 1.15rem .1rem 0 0; border-radius: 999px; background: var(--new); }
.is-read .newdot { background: transparent; }

.save {
  flex: none; margin: .75rem .9rem 0 0; display: inline-flex; align-items: center; gap: .35rem;
  padding: .36rem .72rem; border-radius: 8px; background: transparent;
  border: 1px solid var(--line-strong); color: var(--ink-3); font-size: .76rem; font-weight: 700;
  opacity: .5; transition: opacity .15s, color .15s, border-color .15s;
}
.row:hover .save { opacity: 1; }
.save svg { width: 14px; height: 14px; }
.save:hover { border-color: var(--gold); color: var(--gold); opacity: 1; }
.save[aria-pressed="true"] { color: var(--gold); border-color: var(--gold); opacity: 1; }
.save[aria-pressed="true"] svg { fill: currentColor; }

.empty { padding: 3.4rem 1.5rem; text-align: center; color: var(--ink-3); }
.empty b { display: block; margin-bottom: .3rem; color: var(--ink); font-size: 1.05rem; }

/* ── dialog ─────────────────────────────────────────────────────────────── */
dialog {
  width: min(44rem, 94vw); max-height: 88vh; padding: 0; border: 1px solid var(--line);
  border-radius: 18px; background: var(--panel); color: var(--ink);
  box-shadow: 0 24px 60px rgba(0,0,0,.28);
}
dialog::backdrop { background: rgba(6,16,22,.6); }
.sheet { display: flex; flex-direction: column; max-height: 88vh; }
.sheet-h { display: flex; gap: 1rem; align-items: flex-start; padding: 1.4rem 1.6rem 1.1rem; border-bottom: 1px solid var(--line); }
.sheet-h .when { font-size: .72rem; font-weight: 800; letter-spacing: .11em; text-transform: uppercase; color: var(--brand-2); }
.sheet-h h2 { margin: .3rem 0 .3rem; font-size: 1.45rem; font-weight: 800; letter-spacing: -.02em; line-height: 1.2; }
.sheet-h p { margin: 0; font-size: .83rem; color: var(--ink-3); }
.x { flex: none; width: 38px; height: 38px; border-radius: 9px; background: var(--panel-2); border: 1px solid var(--line); color: var(--ink-2); display: grid; place-items: center; }
.x svg { width: 17px; height: 17px; }
.x:hover { color: var(--brand-2); border-color: var(--brand-2); }
.sheet-b { padding: 1.3rem 1.6rem 1.7rem; overflow-y: auto; }
.prose {
  font-size: 1.06rem; line-height: 1.78; letter-spacing: .002em;
  white-space: pre-wrap; overflow-wrap: break-word; margin: 0 0 1.4rem;
  color: var(--ink);
}
.prose a { color: var(--brand-2); font-weight: 600; overflow-wrap: anywhere; }
.mynote { padding: 1rem 1.15rem; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line); }
.mynote h4 { margin: 0 0 .55rem; font-size: .69rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
.mynote textarea {
  width: 100%; min-height: 5.5rem; resize: vertical; padding: .7rem .85rem;
  border-radius: 9px; border: 1px solid var(--line); background: var(--panel);
  color: var(--ink); font: inherit; font-size: .95rem; line-height: 1.6;
}
.mynote textarea:focus { outline: 2px solid var(--brand-2); outline-offset: -1px; }
.mynote .saved-tick { margin: .4rem 0 0; font-size: .76rem; font-weight: 650; color: var(--green); opacity: 0; transition: opacity .2s; }
.mynote .saved-tick.on { opacity: 1; }
mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 .12em; }

footer { margin-top: 2.5rem; padding: 1.5rem 0 2.5rem; border-top: 1px solid var(--line); color: var(--ink-3); font-size: .82rem; }
footer p { margin: 0; }
:focus-visible { outline: 2px solid var(--brand-2); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media (max-width: 44rem) {
  .banner-in { flex-wrap: wrap; padding: 2rem 0 2.2rem; gap: 1rem; }
  .banner-acts { margin-left: 0; width: 100%; }
  .d { width: 100%; }
  .open { flex-wrap: wrap; gap: .2rem .8rem; }
}
</style>

elix Prehn", "postUrl": "https://friends.goatacademy.org/posts/felixs-weekly-market-notes-felixs-notes-for-19-oct-2025", "text": "https://docs.google.com/document/d/1w6GQC1c6EY3gJyxV2EABwnRV4_4poHqTuPS-1m8xBvA/edit?tab=t.0", "body": null, "recap": "", "line": "", "links": [{"kind": "source_doc", "url": "https://docs.google.com/document/d/1w6GQC1c6EY3gJyxV2EABwnRV4_4poHqTuPS-1m8xBvA/edit"}]}, {"id": "92454327", "title": "Quick notes for 14 Oct 2025", "date": "2025-10-14", "author": "Felix Prehn", "postUrl": "https://friends.goatacademy.org/posts/felixs-weekly-market-notes-quick-notes-for-14-oct-2025", "text": "Quick update: \n\nTo call this market action \"whippy\" and \"volatile\" is a huge understatement! The past three days clearly show the intensity we're facing. \nOn Friday, the Dow dropped close to 900 points, then yesterday it surged nearly 600 points, and today it added over 200 more. \nLooking at the intraday movement, the hour-by-hour swings are astonishing—down over 600 points early on, followed by a sharp \"U-turn\" that erased the loss and pushed gains past 450 points before weakening again, ending with a 203-point rise. \nThis erratic behavior reinforces our ongoing thesis. It highlights why we emphasize not fixating on wild index swings, instead focusing more on industry trends. \nOur Diversified Metals and Uranium picks, as well as Solar recommendations, are still performing well, with some continuing to rocket higher. \nMeanwhile, as expected, most \"Magnificent 7\" stocks are underperforming, and Semiconductor issues, though bullish long-term, are now dragging short-term. \nThis market truly reflects \"good is good, and bad is bad,\" aligning with our industry  strategy!", "body": "Quick update: \n\nTo call this market action \"whippy\" and \"volatile\" is a huge understatement! The past three days clearly show the intensity we're facing. \nOn Friday, the Dow dropped close to 900 points, then yesterday it surged nearly 600 points, and today it added over 200 more. \nLooking at the intraday movement, the hour-by-hour swings are astonishing—down over 600 points early on, followed by a sharp \"U-turn\" that erased the loss and pushed gains past 450 points before weakening again, ending with a 203-point rise. \nThis erratic behavior reinforces our ongoing thesis. It highlights why we emphasize not fixating on wild index swings, instead focusing more on industry trends. \nOur Diversified Metals and Uranium picks, as well as Solar recommendations, are still performing well, with some continuing to rocket higher. \nMeanwhile, as expected, most \"Magnificent 7\" stocks are underperforming, and Semiconductor issues, though bullish long-term, are now dragging short-term. \nThis market truly reflects \"good is good, and bad is bad,\" aligning with our industry  strategy!", "recap": "Quick update: To call this market action \"whippy\" and \"volatile\" is a huge understatement! The past three days clearly show the intensity we're…", "line": "Quick update: To call this market action \"whippy\" and \"volatile\" is a huge understatement! The past three days…", "links": []}, {"id": "91746604", "title": "Felix's notes for 13 Oct 2025", "date": "2025-10-13", "author": "Felix Prehn", "postUrl": "https://friends.goatacademy.org/posts/felixs-weekly-market-notes-felixs-notes-for-13-oct-2025", "text": "", "body": null, "recap": "", "line": "", "links": [{"kind": "video", "url": "https://video.mn.co/assets/142529280/felix_notes.mp4"}]}, {"id": "92164779", "title": "Felix's notes for 5 Oct 2025", "date": "2025-10-05", "author": "Felix Prehn", "postUrl": "https://friends.goatacademy.org/posts/felixs-weekly-market-notes-felixs-notes-for-5-oct-2025", "text": "https://docs.google.com/document/d/19rSInKPRpVdEDX6MmSj9wLfyFseIAZbfjaSqcE4G7-M/edit?tab=t.0", "body": null, "recap": "", "line": "", "links": [{"kind": "source_doc", "url": "https://docs.google.com/document/d/19rSInKPRpVdEDX6MmSj9wLfyFseIAZbfjaSqcE4G7-M/edit"}]}, {"id": "91746602", tes-for-12-may-2025", "text": "https://docs.google.com/document/d/1RNp0JMVw0g0fAv9ajA2SOVxwfJJ0dLI5VpAlxme9nH8/edit?tab=t.0", "body": null, "recap": "", "line": "", "links": [{"kind": "source_doc", "url": "https://docs.google.com/document/d/1RNp0JMVw0g0fAv9ajA2SOVxwfJJ0dLI5VpAlxme9nH8/edit"}]}, {"id": "84018746", "title": "Felix' notes for 05 May 2025", "date": "2025-05-05", "author": "Felix Prehn", "postUrl": "https://friends.goatacademy.org/posts/felixs-weekly-market-notes-felix-notes-for-05-may-2025", "text": "https://docs.google.com/document/d/1lujL-2lFF1BjqnyabkFGAWXD3DVFFFWE1-7hVu3K1yA/edit?tab=t.0", "body": null, "recap": "", "line": "", "links": [{"kind": "source_doc", "url": "https://docs.google.com/document/d/1lujL-2lFF1BjqnyabkFGAWXD3DVFFFWE1-7hVu3K1yA/edit"}]}, {"id": "83678784", "title": "Felix' notes for 28 April 2025", "date": "2025-04-28", "author": "Felix Prehn", "postUrl": "https://friends.goatacademy.org/posts/felixs-weekly-market-notes-felix-notes-for-28-april-2025", "text": "https://docs.google.com/document/d/1XoOE2aYZV22OVd6vzuTdApdpZgilF4bhQDPgoN98tJE/edit?pli=1&tab=t.0", "body": "Summary of Last Week\n\nIn my opinion, the stock market last week (ending April 25, 2025) delivered a strong rally, continuing its volatile but predictable rhythm. I observed that the market moved higher after the short-term pullback ended on Monday, April 21st, marking the start of the next rally. Most major indexes, including the S&P 500, NASDAQ, Russell 2000, and QQQs, closed above their short-term upside targets (e.g., S&P 500 at 5,500, NASDAQ at 17,205) on Friday, though the Dow lagged, not yet confirming a close above 40,800. I noted signs of \"churning\" in Friday's trading, with modest advance-decline ratios on the NYSE and OTC markets and negative volume figures on the Amex, partly due to a correction in gold stocks. However, positive upside/downside volume on the OTC market suggests strength in speculative and oversold tech stocks. I also saw the CBOE Market Volatility Index (VIX) decline by 1.63 points to 24.81, near its 50-day moving average of 24.98, indicating easing short-term fear. Overall, I believe last week's rally aligns with my expectation of a robust advance, though it's showing early signs of fatigue.\n\nShort-Term Outlook\n\nIn my opinion, the short-term market outlook remains favorable, with the next rally progressing as anticipated. I'm encouraged by the strength of most indexes, which closed above key levels like S&P 500 at 5,500, NASDAQ at 17,205, Russell 2000 at 1,932, and QQQs at 470 on April 25th. However, I'm noting potential weaknesses, as the Dow has not yet closed above 40,800, creating a possible \"negative divergence.\" If the Dow confirms this breakout within 1–2 sessions, I expect further upside momentum. Conversely, if the S&P 500 closes below 5,475, I anticipate a short-term correction starting. I believe any such correction would be \"controlled,\" unlikely to test the April 21st low (~5,100 for the S&P 500) or the April 7th panic lows. Supporting this view, I observed more 52-week highs than lows on the NYSE and OTC markets for three consecutive sessions, and stochastic and MACD indicators remain on buy signals. The VIX at 24.81, while above its 150-day (19.71) and 200-day (19.35) moving averages, suggests manageable volatility. I'm also noting the High Anxiety Index, a 25-day measure of advance-decline differences, which hit 32,562 on April 24th, its highest since November 2022, signaling short-term strength. The Investors Intelligence survey shows bullish advisors at 23.5%, the lowest since December 2008, which I view as a positive contrarian signal. I believe these factors support continued upside testing, though a brief pause may occur soon.\n\nLong-Term Outlook\n\nIn my opinion, the long-term market outlook remains negative, indicating challenges over the coming months. I'm concerned that most major indexes, including the S&P 500 (200-day moving average at 5,747), Dow (42,226), NASDAQ (18,339), Russell 2000 (2,191), and QQQs (491), are trading below their 200-day moving averages, signaling persistent weakness. An exception is the Dow Jones Utility Average, which closed at 1,021, slightly above its 200-day moving average of 1,014, suggesting relative strength in utilities. I also observed that the percentage of NYSE stocks above their 30-week moving averages has fallen to 26.8%, the lowest since November 2023, reflecting broad market deterioration. The NYSE Advance-Decline Line, tracking the difference between advancing and declining stocks, has improved from last summer's lows but remains weak, while the OTC and Amex equivalents, though recovering, are far from positive after hitting 30-year lows. The NYSE Momentum Index, a 200-day average of advance-decline differences, is showing early signs of recovery but contrasts with the OTC Momentum Index, which remains negative at -89, its lowest since December 2023. Despite these concerns, I'm optimistic about gold, which remains in a strong Climbing Pattern, reaching a new high of 3,486 on April 22nd. The HUI Gold BUGS Index hit a 12-year high of 416 on April 21st, though both are extended, with potential support at 3,165–3,190 for gold and 365–370 for the HUI. I believe these metrics highlight a difficult long-term environment, with gold as a notable exception.\n\nBullish Sectors (Dow Jones Industry Indices)\n\nIn my opinion, the following sectors, based on Dow Jones Industry indices, show bullish potential:\n\n  - Electronic Equipment, Instruments & Components\n  - Gold\n  - Health Care Providers & Services\n  - Multi-Utilities\n  - Tobacco\n  - Water Utilities\n  - Crypto\n\nBearish Sectors (Dow Jones Industry Indices)\n\nIn my opinion, the following sectors, based on Dow Jones Industry indices, face bearish conditions:\n\n  - Airlines\n  - Auto Components\n  - Banks\n  - Biotechnology\n  - Building Products\n  - Chemicals\n  - Construction & Engineering\n  - Construction Materials\n  - Consumer Finance\n  - Electrical Equipment\n  - Health Care Equipment & Supplies\n  - Hotels, Restaurants & Leisure\n  - Household Durables\n  - IT Services\n  - Machinery\n  - Media\n  - Oil, Gas & Consumable Fuels\n  - Real Estate Investment Trusts (REITs)\n  - Semiconductors & Semiconductor Equipment\n  - Software\n  - Specialty Retail\n  - Trading Companies & Distributors\n  - Transportation Infrastructure\n\nThis report reflects my opinions based on publicly available data from the weekly update. If you'd like me to clarify any terms or dive deeper into specific metrics, let me know!\n\n### WHAT I AM BUYING\n\nI am planning to set up buy or buy stop orders on the following stocks this morning:\n\n[Felix Buy Orders](https://docs.google.com/spreadsheets/d/1D_-SM_3O64iR9s8ZhmhklZmXGU-Fz9CfV_BJ-4rKU0c/edit?usp=sharing)\n\nRemember the most important rule is to preserve your capital.\n\n### CHARTS", "recap": "Summary of Last Week In my opinion, the stock market last week ending April 25, 2025 delivered a strong rally, continuing its volatile but…", "line": "Summary of Last Week In my opinion, the stock market last week ending April 25, 2025 delivered a strong rally,…", "links": [{"kind": "source_doc", "url": "https://docs.google.com/document/d/1XoOE2aYZV22OVd6vzuTdApdpZgilF4bhQDPgoN98tJE/edit"}]}, {"id": "83437464", "title": "Felix' notes for 23 April 2025", "date": "2025-04-23", "author": "Felix Prehn", "postUrl": "https://friends.goatacademy.org/posts/felixs-weekly-market-notes-felix-notes-for-23-april-2025", "text": "https://docs.google.com/document/d/11WAeIfEpGj-88NVYMjFFRTo9RQNK5hYf9fAKHu9Y8_s/edit?tab=t.0", "body": "**Market Update Report: April 22, 2025**\n\n**Summary of the Day**\n\nOn Tuesday, April 22, 2025, the stock market mounted a robust rally, with major indexes—the S&P 500, Dow Jones Industrial Average, NASDAQ Composite, and Russell 2000—closing significantly higher. For the first time in 19 days, the NYSE recorded slightly more stocks hitting new yearly highs than new lows, a shift from recent downward pressure. Trading volume reflected strong participation, with advancing stocks outnumbering decliners and upside volume surpassing downside on the NYSE and OTC markets. The CBOE Market Volatility Index (VIX) declined by 3.25 points to 30.57, suggesting easing short-term market fear, though it remains elevated above its longer-term averages.\n\n**Market Outlook**\n\nThe broader market trend remains bearish, warranting vigilance. Nevertheless, the short-term outlook shows signs of improvement. Yesterday's report noted that the market was approaching a potential low, supported by a sharp reduction in new 52-week lows (from 1,162 on the NYSE and 1,757 OTC at the panic lows to 102 and 202, respectively). Today's rally bolsters the view that the recent downward phase has likely concluded, and a short-term upward movement is now in motion. If key index levels—S&P 500 at 5,500, Dow at 40,800, NASDAQ at 17,205, Russell 2000 at 1,932, and Invesco QQQ Trust at 470—are exceeded in the coming days, this rally could develop into a more substantial intermediate-term advance. However, volatility is expected, and the ascent is unlikely to be uninterrupted.\n\n**Sector Observations**\n\n  - **Bullish Sectors**: Within the Dow Jones Industry indices, stocks in Base Pattern (early recovery) and Climbing Pattern (upward momentum) phases are demonstrating strength. These sectors are poised to capitalize on current oversold conditions, potentially driving near-term gains if the rally persists.\n  - **Bearish Gold Bulls**: Gold-related stocks, as represented by the Dow Jones Precious Metals Index, are anticipated to experience weaker short-term performance. A close below critical levels, such as 50 for the GDX ETF, could accelerate a short-term correction in these stocks. However, such a pullback may set the stage for a future buying opportunity for those monitoring this sector.\n\n**Key Metrics to Monitor**\n\n  - **Market Breadth**: Today's trading showed more advancing stocks than decliners across major exchanges, with higher upside volume on the NYSE and OTC markets. This broad participation is a short-term positive, but its durability remains uncertain.\n  - **Volatility (VIX)**: The VIX's decline is a tentative positive, yet its position above its 50-day, 150-day, and 200-day moving averages underscores ongoing intermediate-term uncertainty. A sustained move below these averages would indicate improving market stability.\n\n*Note: This report reflects my market observations and does not constitute investment advice. Consult a financial professional for personalized guidance.*", "recap": "Market Update Report: April 22, 2025 Summary of the Day On Tuesday, April 22, 2025, the stock market mounted a robust rally, with major indexes—the…", "line": "Market Update Report: April 22, 2025 Summary of the Day On Tuesday, April 22, 2025, the stock market mounted a robust…", "links": [{"kind": "source_doc", "url": "https://docs.google.com/document/d/11WAeIfEpGj-88NVYMjFFRTo9RQNK5hYf9fAKHu9Y8_s/edit"}]}, {"id": "83331673", "title": "Felix' notes for 21 April 2025 - Weekly", "date": "2025-04-21", "author": "Felix Prehn", "postUrl": "https://friends.goatacademy.org/posts/felixs-weekly-market-notes-felix-notes-for-21-april-2025-weekly", "text": "https://docs.google.com/document/d/1XjDZQ0IgLhzGI1ZrXgfJ61VYvJ2UwlQtw4a7z9SgOH8/edit?usp=sharing", "body": null, "recap": "", "line": "", "links": [{"kind": "source_doc", "url": "https://docs.google.com/document/d/1XjDZQ0IgLhzGI1ZrXgfJ61VYvJ2UwlQtw4a7z9SgOH8/edit"}]}, {"id": "83315540", "title": "Felix's notes for 14 April 2025 WEEKLY", "date": "2025-04-14", "author": "Felix Prehn", "postUrl": "https://friends.goatacademy.org/posts/felixs-weekly-market-notes-felixs-notes-for-14-april-2025-weekly", "text": "https://docs.google.com/document/d/1hga0Z9GZjuScttsSBp6u3SEf4yyGFzojwbDYNKWl0Gs/edit?tab=t.0", "body": null, "recap": "", "line": "", "links": [{"kind": "source_doc", "url": "https://docs.google.com/document/d/1hga0Z9GZjuScttsSBp6u3SEf4yyGFzojwbDYNKWl0Gs/edit"}]}, {"id": "83315542", "title": "Felix's notes for 10 April 2025", "date": "2025-04-10", "author": "Felix Prehn", "postUrl": "https://friends.goatacademy.org/posts/felixs-weekly-market-notes-felixs-notes-for-10-april-2025", "text": "https://docs.google.com/document/d/1reKCk837nlj9kA4B0SJiCaMoU6odRzmXLvy-JRhUiEA/edit?usp=sharing", "body": "What a day! 2nd biggest Nasdaq rally ever. IMHO Trump needed to put out the fire in the bond market.  See yesterday's note on that story and [What EVERY Investor Needs to Do with Their Money ASAP (Why Trump Flipped!)](https://youtu.be/RJrhJU8jHMU)\n\nThe VIX collapsed. Biggest single day decline ever.  Which is positive, though the actual VIX level is still high - which is a medium term problem.\n\nNote the major indices are all below the 200/150/50 moving averages, so we have some rallying to do to get back to a stable market.\n\nOn a positive side, breadth was good, and there are a lot of short positions, which could help sustain this rally:\n\nI will continue to be disciplined and go slow.  Use this rebound to reduce risk.  Trump says this isn't over yet.  Who am I to question the mighty...", "recap": "What a day! 2nd biggest Nasdaq rally ever. IMHO Trump needed to put out the fire in the bond market. See yesterday's note on that story and What…", "line": "What a day! 2nd biggest Nasdaq rally ever. IMHO Trump needed to put out the fire in the bond market. See yesterday's…", "links": [{"kind": "source_doc", "url": "https://docs.google.com/document/d/1reKCk837nlj9kA4B0SJiCaMoU6odRzmXLvy-JRhUiEA/edit"}]}, {"id": "83315543", "title": "Felix' notes for 9 April 2025", "date": "2025-04-09", "author": "Felix Prehn", "postUrl": "https://friends.goatacademy.org/posts/felixs-weekly-market-notes-felix-notes-for-9-april-2025", "text": "https://docs.google.com/document/d/1skZr1ZRiY5qhE8fNavWEtQhyEh2QzZI8yZGC_gVuGVc/edit?usp=sharing", "body": "It's not a good sign that the VIX closed 11% higher yet again.\n\nMore stocks declined than advanced - not a good sign:\n\nSo for now, I will remain defensive.\n\nBut... even defensive stocks are selling off:\n\nI think it was Elliott, who said a few days ago, in a crash correlation goes to 1.  Ie everything falls in a panic.\n\nSometimes the market just tells us, sit on your hands and use this time to hone your skills.\n\nAny itch you have to trade, try it in a paper trading account, and build experience that way.\n\nGreat opportunities will be coming.\n\nRemember the market rewards the patient, not the active.\n\nPS: It seems we are seeing a collapse of what is know as the basis trade.  In short about $1.5T in mostly hedge fund money is in that trade.  As bond yields are rising rapidly it appears this trade is in serious trouble and signals a liquidity crisis.\n\nHere is a primer on the Basis Trade you may hear a lot about in the next few hours:\n\nA basis trade is a strategy where investors, like hedge funds, profit from small price differences between a **bond** (e.g., a U.S. Treasury bond) and a **bond futures contract** (an agreement to buy or sell that bond later at a set price). The \"basis\" is the gap between these two prices. It's a low-risk play because the bond and futures prices are closely linked and tend to converge over time. Here's how it works, step-by-step, followed by what happens if bond prices drop fast:\n\n1.  **Two Prices, One Opportunity**:\n      - The bond has a current market price (the \"cash price\").\n      - The futures contract has a price based on the same bond, reflecting future expectations.\n      - These prices should be close, but they can drift apart due to market conditions, interest rates, or supply/demand.\n2.  **Spotting the Gap**:\n      - If the bond's cash price is lower than the futures price (adjusted for interest rates), the bond is \"cheap.\"\n      - If the futures price is lower than the cash price, the futures are \"cheap.\"\n      - The basis trade exploits this mismatch.\n3.  **The Trade**:\n      - **If the bond is cheap**: Buy the bond and sell the futures. When the futures expire, deliver the bond and profit from the difference.\n      - **If the futures are cheap**: Buy the futures and sell the bond short (borrow and sell it). Later, buy the bond back to deliver and profit.\n      - The profit comes when the prices realign, which they typically do by expiration.\n4.  **Why It Works**:\n      - The bond and futures are mathematically tied (arbitrage ensures convergence).\n      - It's a small, steady profit strategy for big investors with lots of capital.\n\n**What Happens If Bond Prices Rapidly Fall?**\n\nNow, let's say bond prices suddenly plummet-maybe due to rising interest rates (bond prices fall when rates rise), a market panic, or unexpected economic news. This can shake up the basis trade:\n\n  - **Impact on the Trade**:\n      - **If you bought the bond and sold futures**: You're holding a bond that's now worth less. If the futures price doesn't fall as much or as fast, the basis (gap) widens instead of narrowing. You could face a loss if you had to sell the bond early or if the trade doesn't converge as expected by expiration.\n      - **If you bought futures and shorted the bond**: A rapid fall in bond prices is good for your short position (you sell high, buy back lower), but the futures price might not drop in sync. If the futures hold steady or fall less, the basis shifts, and your profit could shrink-or turn into a loss.\n  - **Margin Calls and Leverage**:\n      - Basis trades often use borrowed money (leverage) to amplify small profits. If bond prices crash, the value of your position drops, and lenders might demand more cash (a margin call). If you can't cover it, you're forced to sell at a loss, amplifying the damage.\n      - Example: You bought $1 million in bonds with $100,000 of your own money. If prices fall 10%, your bonds are worth $900,000, and you might owe more than you have.\n  - **Real-World Twist**:\n      - In extreme cases (like a 2008-style crisis), the basis can blow out-meaning the gap grows huge and stays that way for a while. This happened with Treasury basis trades during past market shocks, catching some traders off guard.", "recap": "It's not a good sign that the VIX closed 11% higher yet again. More stocks declined than advanced - not a good sign: So for now, I will remain…", "line": "It's not a good sign that the VIX closed 11% higher yet again. More stocks declined than advanced - not a good sign:…", "links": [{"kind": "source_doc", "url": "https://docs.google.com/document/d/1skZr1ZRiY5qhE8fNavWEtQhyEh2QzZI8yZGC_gVuGVc/edit"}]}, {"id": "83315546", "title": "Felix' notes for 7 April 2025", "date": "2025-04-07", "author": "Felix Prehn", "postUrl": "https://friends.goatacademy.org/posts/felixs-weekly-market-notes-felix-notes-for-7-april-2025", "text": "https://docs.google.com/document/d/1KfHyjh--TmELl7HG0pinqpiPD675lm4_F4oU6oA3BRQ/edit?usp=sharing", "body": "I was planning to set up buy or buy stop orders on the following stocks this morning:\n\nCELH, a soft drink maker, if it closed above 37.65 with a stop at:\n\n  - Trading 32.99\n  - Investing 29.39\n\nFortis, a utility company, if it pulls back to 45 with a stop at\n\n  - Trading 43.99\n  - Investing 42.89\n\nRKT, a mortgage co, it it pulls back close to 14, and more aggressively if it closes above 15.80, with a stop at\n\n  - Trading 13.69\n  - Investing 11.49\n\nDG, consumer staples/retail, if it pulls back to 90-91, with a stop at\n\n  - Trading 84.48\n  - Investing 77.99\n\nWhy? Consumer staples, utilities and mortgages are defensive sectors, and each of these companies is fundamentally sound IMHO and has rare momentum.\n\nAs Asian markets crashed over night, futures are deep red and VIX is on the move up, sitting this day out may be the smartest move.  Remember the 2nd layer of tariffs comes into force on 9 April.  Some people are still hoping for delay on those and may get disappointed.\n\nJudging by the general panic on social media, reports of margin calls at hedge funds, I'd say we are near the bottom of the market, but as this is politics driven, I shall wait for calmer waters.\n\nRemember the most important rule is to preserve your capital.\n\n**CHARTS**", "recap": "I was planning to set up buy or buy stop orders on the following stocks this morning: CELH, a soft drink maker, if it closed above 37.65 with a stop…", "line": "I was planning to set up buy or buy stop orders on the following stocks this morning: CELH, a soft drink maker, if it…", "links": [{"kind": "source_doc", "url": "https://docs.google.com/document/d/1KfHyjh--TmELl7HG0pinqpiPD675lm4_F4oU6oA3BRQ/edit"}]}], "years": ["2026", "2025"], "linkLabels": {"source_doc": "Open the note", "watchlist_sheet": "Watchlist", "article": "Read the note", "heartbeat": "Heartbeat Scanner", "video": "Watch the video"}};
const NOTES = DATA.notes;
const KEY = "felix-notes-v2";

const ICON = {
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.5 5.5L20 6"/></svg>',
  bookmark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>',
  moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg>',
  sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>',
};

let state = { read: [], bm: [], theme: null, mine: {} };
try { Object.assign(state, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
const read = new Set(state.read || []);
const bm = new Set(state.bm || []);
const mine = state.mine && typeof state.mine === "object" ? state.mine : {};
const save = () => {
  try {
    localStorage.setItem(KEY, JSON.stringify(
      { read: [...read], bm: [...bm], theme: state.theme, mine }));
  } catch (e) {}
};

let onlyBm = false;
let year = "all";
let query = "";

/* ── theme ──────────────────────────────────────────────────────────────── */
const themeBtn = document.getElementById("theme");
const isDark = () => state.theme
  ? state.theme === "dark"
  : matchMedia("(prefers-color-scheme: dark)").matches;

function paintTheme() {
  if (state.theme) document.documentElement.setAttribute("data-theme", state.theme);
  else document.documentElement.removeAttribute("data-theme");
  themeBtn.innerHTML = isDark() ? ICON.sun : ICON.moon;
}
themeBtn.addEventListener("click", () => {
  state.theme = isDark() ? "light" : "dark";
  paintTheme(); save();
});
paintTheme();

/* ── helpers ────────────────────────────────────────────────────────────── */
const esc = s => (s ?? "").replace(/[&<>"]/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

const fmt = d => d ? new Date(d + "T00:00:00Z").toLocaleDateString("en-GB",
  { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" }) : "Undated";
const fmtLong = d => d ? new Date(d + "T00:00:00Z").toLocaleDateString("en-GB",
  { day: "numeric", month: "long", year: "numeric", timeZone: "UTC" }) : "Undated";

function hl(text, q) {
  if (!q) return esc(text);
  const re = new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig");
  return esc(text).replace(re, "<mark>$1</mark>");
}

/* The note text carries its links inline as plain URLs, so turn them into
   real links rather than listing them separately. */
function linkify(text) {
  return esc(text).replace(/https?:\/\/[^\s<]+/g, raw => {
    const url = raw.replace(/[.,;:)\]]+$/, "");
    const tail = raw.slice(url.length);
    return `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>${tail}`;
  });
}

/* When a note matches on its text rather than its title, show the passage that
   matched — otherwise the row gives no clue why it is in the results. */
function matchLine(n, q) {
  if (!q || n.title.toLowerCase().includes(q.toLowerCase())) return "";
  const hay = n.body || n.text || "";
  const at = hay.toLowerCase().indexOf(q.toLowerCase());
  if (at < 0) return "";
  const from = Math.max(0, at - 55);
  const raw = (from ? "…" : "") + hay.slice(from, at + q.length + 85).replace(/\s+/g, " ").trim() + "…";
  return `<span class="ctx">${hl(raw, q)}</span>`;
}

const matches = n => {
  if (year !== "all" && (n.date || "").slice(0, 4) !== year) return false;
  if (onlyBm && !bm.has(n.id)) return false;
  if (!query) return true;
  const q = query.toLowerCase();
  return n.title.toLowerCase().includes(q)
    || (n.body || "").toLowerCase().includes(q)
    || n.text.toLowerCase().includes(q);
};

/* ── latest ─────────────────────────────────────────────────────────────── */
function renderLatest() {
  const [lead, ...rest] = NOTES.slice(0, 5);
  if (!lead) { document.getElementById("latest").innerHTML = ""; return; }

  document.getElementById("latest").innerHTML = `
    <button class="lead" data-id="${esc(lead.id)}">
      <span class="kicker">Newest &middot; ${fmt(lead.date)}</span>
      <h3>${esc(lead.title)}</h3>
      <p>${esc(lead.recap)}</p>
      <span class="go">Read the note &rarr;</span>
    </button>
    <div class="stack">
      <div class="stack-h">Also recent</div>
      ${rest.map(n => `
        <button class="mini" data-id="${esc(n.id)}">
          <span class="when">${fmt(n.date)}</span>
          <h4>${esc(n.title)}</h4>
        </button>`).join("")}
    </div>`;
}

/* ── year dropdown ──────────────────────────────────────────────────────── */
/* A dropdown rather than buttons: a new year arrives every January and a
   growing row would eventually wrap across the page. */
function renderYears() {
  const opts = [["all", `All years (${NOTES.length})`]].concat(
    DATA.years.map(y => [y,
      `${y} (${NOTES.filter(n => (n.date || "").slice(0, 4) === y).length})`]));
  document.getElementById("year").innerHTML = opts.map(([v, label]) =>
    `<option value="${v}"${year === v ? " selected" : ""}>${label}</option>`).join("");
}

/* ── list ───────────────────────────────────────────────────────────────── */
function renderList() {
  const hits = NOTES.filter(matches);
  const el = document.getElementById("list");
  document.getElementById("shown").textContent =
    hits.length === NOTES.length ? `${NOTES.length} notes`
                                 : `${hits.length} of ${NOTES.length} notes`;

  if (!hits.length) {
    el.innerHTML = `<div class="empty"><b>Nothing to show</b>${
      onlyBm ? "Save a note and it will appear here." : "Try a different search or year."}</div>`;
    return;
  }

  const groups = new Map();
  for (const n of hits) {
    const y = n.date ? n.date.slice(0, 4) : "Undated";
    if (!groups.has(y)) groups.set(y, []);
    groups.get(y).push(n);
  }

  el.innerHTML = [...groups].map(([y, rows]) => `
    <div class="ygroup"><b>${y}</b><span>${rows.length} note${rows.length === 1 ? "" : "s"}</span></div>
    ${rows.map(n => `
      <div class="row ${read.has(n.id) ? "is-read" : ""}">
        <button class="readbox" data-read="${esc(n.id)}" role="checkbox"
          aria-checked="${read.has(n.id)}"
          title="${read.has(n.id) ? "Mark as unread" : "Mark as read"}">
          <span class="box">${ICON.check}</span></button>
        <span class="newdot" aria-hidden="true"></span>
        <button class="open" data-id="${esc(n.id)}">
          <span class="d">${fmt(n.date)}</span>
          <span class="body">
            <span class="t">${hl(n.title, query)}</span>
            ${matchLine(n, query) || (n.line ? `<span class="line">${esc(n.line)}</span>` : "")}
          </span>
        </button>
        <button class="save" data-bm="${esc(n.id)}" aria-pressed="${bm.has(n.id)}"
          title="Save this note">${ICON.bookmark}${bm.has(n.id) ? "Saved" : "Save"}</button>
      </div>`).join("")}`).join("");
}

/* ── detail ─────────────────────────────────────────────────────────────── */
const sheet = document.getElementById("sheet");

let openId = null;

function paintSheetSave() {
  const btn = document.getElementById("s-save");
  btn.innerHTML = ICON.bookmark + (bm.has(openId) ? "Saved" : "Save");
  btn.setAttribute("aria-pressed", bm.has(openId));
}

function openNote(id) {
  const n = NOTES.find(x => x.id === id);
  if (!n) return;
  openId = id;

  document.getElementById("s-when").textContent = fmtLong(n.date);
  document.getElementById("s-title").textContent = n.title;
  document.getElementById("s-by").textContent = n.author;
  paintSheetSave();

  const text = n.body || n.text || "";
  document.getElementById("s-text").innerHTML =
    text ? `<div class="prose">${linkify(text)}</div>` : "";

  document.getElementById("s-mynote").value = mine[id] || "";
  document.getElementById("s-tick").classList.remove("on");
  document.querySelector(".sheet-b").scrollTop = 0;
  sheet.showModal();

  if (!read.has(id)) { read.add(id); save(); refresh(); }
}

/* ── wiring ─────────────────────────────────────────────────────────────── */
function refresh() { renderLatest(); renderList(); }

document.addEventListener("click", e => {
  const r = e.target.closest("[data-read]");
  if (r) {
    const id = r.dataset.read;
    read.has(id) ? read.delete(id) : read.add(id);
    save(); refresh(); return;
  }
  const b = e.target.closest("[data-bm]");
  if (b) {
    const id = b.dataset.bm;
    bm.has(id) ? bm.delete(id) : bm.add(id);
    save(); refresh(); return;
  }
  const o = e.target.closest("[data-id]");
  if (o) openNote(o.dataset.id);
});

document.getElementById("bmfilter").addEventListener("click", () => {
  onlyBm = !onlyBm;
  const btn = document.getElementById("bmfilter");
  btn.setAttribute("aria-pressed", onlyBm);
  document.getElementById("bmlabel").textContent = onlyBm ? "Showing saved" : "Bookmarked";
  renderList();
});

document.getElementById("year").addEventListener("change", e => {
  year = e.target.value;
  renderList();
});

document.getElementById("s-save").addEventListener("click", () => {
  if (!openId) return;
  bm.has(openId) ? bm.delete(openId) : bm.add(openId);
  save(); paintSheetSave(); refresh();
});

let noteTimer;
document.getElementById("s-mynote").addEventListener("input", e => {
  if (!openId) return;
  const value = e.target.value;
  clearTimeout(noteTimer);
  noteTimer = setTimeout(() => {
    if (value.trim()) mine[openId] = value;
    else delete mine[openId];
    save();
    const tick = document.getElementById("s-tick");
    tick.classList.add("on");
    setTimeout(() => tick.classList.remove("on"), 1400);
  }, 400);
});

document.getElementById("s-close").addEventListener("click", () => sheet.close());
sheet.addEventListener("click", e => {
  const box = sheet.querySelector(".sheet").getBoundingClientRect();
  if (e.clientY < box.top || e.clientY > box.bottom
   || e.clientX < box.left || e.clientX > box.right) sheet.close();
});

let t;
document.getElementById("q").addEventListener("input", e => {
  clearTimeout(t);
  const v = e.target.value;
  t = setTimeout(() => { query = v.trim(); renderList(); }, 120);
});

renderYears();
refresh();
</script>

</html>
